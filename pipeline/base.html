<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(Poppins-Bold.ttf)}
html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="caps.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,H=640,INK='#14050a';
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),sm=x=>{x=cl(x);return x*x*(3-2*x)};
const seg=(t,a,b)=>sm((t-a)/(b-a));
let seed=1;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function fs(c,st=true,lw=3){ctx.fillStyle=c;ctx.fill();if(st){ctx.lineWidth=lw;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.stroke()}}
function ell(x,y,rx,ry,c,st=true,lw=3){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);fs(c,st,lw)}
function bg(c1,c2){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}

/* ---------- personnage ---------- */
function face(t,o){ // o: {cx,cy,s,look:[dx,dy],mouth:'line'|'hand'|'open',hand:0..1,blink}
  const {cx,cy,s}=o;ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  // capuche
  const HC=o.hc||'#6a6f7d';ctx.beginPath();ctx.ellipse(0,-10,150,140,0,0,7);fs(HC,true,4);
  // épaules
  ctx.beginPath();ctx.moveTo(-210,330);ctx.quadraticCurveTo(-190,150,-90,130);ctx.lineTo(90,130);ctx.quadraticCurveTo(190,150,210,330);ctx.closePath();fs(HC,true,4);if(o.stars){ctx.fillStyle='#ffe27a';for(const [x,y] of [[-120,230],[-40,280],[50,220],[130,270],[-70,170],[90,170]]){ctx.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,r=k%2?5:12;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.fill()}}
  // visage
  ctx.beginPath();ctx.ellipse(0,20,110,125,0,0,7);fs('#f2b98a',true,4);
  // cheveux
  ctx.beginPath();ctx.moveTo(-112,-20);ctx.quadraticCurveTo(-90,-130,0,-125);ctx.quadraticCurveTo(95,-130,112,-20);ctx.quadraticCurveTo(60,-60,-5,-55);ctx.quadraticCurveTo(-70,-50,-112,-20);fs('#c8583a',true,4);
  // joues + taches
  ctx.fillStyle='rgba(220,90,80,.35)';ctx.beginPath();ctx.ellipse(-62,70,24,14,0,0,7);ctx.ellipse(62,70,24,14,0,0,7);ctx.fill();
  ctx.fillStyle='#b36a3c';for(const [x,y] of [[-70,55],[-55,50],[-45,60],[60,52],[72,58],[50,62]]){ctx.beginPath();ctx.arc(x,y,2.6,0,7);ctx.fill()}
  // yeux
  const bl=o.blink?cl(1-Math.abs(Math.sin(t*2.1))**40*1,0.08,1):1, [lx,ly]=o.look||[0,0], er=o.eye||1;
  for(const sx of[-1,1]){const ex=sx*46,ey=18;ctx.save();ctx.translate(ex,ey);ctx.scale(1,bl);
    ctx.beginPath();ctx.ellipse(0,0,31*er,35*er,0,0,7);fs('#fff',true,4);
    ctx.fillStyle=INK;ctx.beginPath();ctx.arc(lx*16,ly*16,15*er,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(lx*16-5,ly*16-6,5,0,7);ctx.fill();ctx.restore();
    // sourcil
    ctx.strokeStyle=INK;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx*18,-44-(o.brow||0));ctx.lineTo(sx*76,-24-(o.brow||0)*0.2+sx*(-1)*0);ctx.stroke();}
  // nez
  ctx.strokeStyle='#b36a3c';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,40);ctx.quadraticCurveTo(10,62,-2,66);ctx.stroke();
  // bouche
  if(o.mouth==='open'){ctx.beginPath();ctx.ellipse(0,98,18,12+4*Math.sin(t*6),0,0,7);fs('#5a1218',true,3)}
  else if(o.mouth==='grin'){ctx.beginPath();ctx.moveTo(-46,86);ctx.quadraticCurveTo(0,140,46,86);ctx.quadraticCurveTo(0,96,-46,86);ctx.closePath();fs('#fff',true,4);ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-40,98);ctx.lineTo(40,98);ctx.stroke()} else if(o.mouth!=='hand'){ctx.strokeStyle=INK;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-16,98);ctx.quadraticCurveTo(0,90,16,98);ctx.stroke()}
  // main
  if((o.hand||0)>0){const h=sm(o.hand);ctx.save();ctx.translate(0,260-h*165);
    ctx.beginPath();ctx.ellipse(0,0,62,52,0,0,7);fs('#f2b98a',true,4);
    for(let i=-2;i<=2;i++){ctx.beginPath();ctx.roundRect(i*24-11,-72+Math.abs(i)*7,22,50,11);fs('#f2b98a',true,4)}
    ctx.restore()}
  ctx.restore()}

/* ---------- décors ---------- */
function wall(t,sev){bg('#2a0710','#130308');ctx.fillStyle='rgba(255,60,60,.05)';for(let x=0;x<W;x+=60)ctx.fillRect(x,0,3,H)}
function bench(y,h,x0=-20,x1=W+20){ // dessous de banquette
  ctx.fillStyle='#1c0a10';ctx.fillRect(x0,0,x1-x0,y+h);
  rr(x0,y-10,x1-x0,h+14,6);fs('#4a1620',true,4);
  ctx.fillStyle='rgba(255,90,90,.16)';ctx.fillRect(x0,y-4,x1-x0,6);
  // ombres de lattes
  ctx.fillStyle='rgba(0,0,0,.35)';for(let x=x0+30;x<x1;x+=70)ctx.fillRect(x,y+4,4,h-6)}
function hud(t,r){ctx.save();ctx.font='700 13px P';ctx.textBaseline='middle';
  rr(16,22,112,26,5);ctx.fillStyle='rgba(30,6,10,.8)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#ff4a4a';ctx.stroke();
  if(Math.floor(t*1.6)%2===0){ctx.fillStyle='#ff3b3b';ctx.beginPath();ctx.arc(32,35,5,0,7);ctx.fill()}
  ctx.fillStyle='#ffd9d9';ctx.fillText(t>=15.2?'REC · EN JEU':'REC · NUIT',44,36);ctx.textAlign='right';ctx.fillStyle='#ffb0b0';ctx.fillText(r||'00:00',W-16,36);ctx.restore()}
function grade(t,pulse){const v=ctx.createRadialGradient(W/2,H*.5,H*.25,W/2,H*.5,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.65)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  seed=Math.floor(t*30)*97+5;ctx.fillStyle='rgba(255,255,255,.05)';for(let i=0;i<90;i++)ctx.fillRect(rnd()*W,rnd()*H,1.4,1.4);
  if(pulse){ctx.fillStyle=`rgba(255,20,20,${.05+.05*Math.sin(t*5)})`;ctx.fillRect(0,0,W,H)}}


function parse(s){const out=[];let red=false;for(const raw of s.split(' ')){let w=raw;let r=red;if(w.startsWith('[')){red=true;r=true;w=w.slice(1)}if(w.endsWith(']')){red=false;r=true;w=w.slice(0,-1)}out.push([w,r])}return out}
function glow(x,y,r,c){const g=ctx.createRadialGradient(x,y,2,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(255,200,60,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r)}
function coin(x,y,r,t,spin){ // doublon pirate original : tête de mort + os croisés
  ctx.save();ctx.translate(x,y);
  glow(0,0,r*2.4,'rgba(255,205,70,.55)');
  const sx=spin?Math.cos(t*2.2):1;ctx.scale(Math.abs(sx)<.12?.12:sx,1);
  // rayons doux
  ctx.save();ctx.rotate(t*.4);ctx.fillStyle='rgba(255,220,110,.16)';for(let i=0;i<10;i++){ctx.rotate(Math.PI/5);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(r*2.1,-r*.12);ctx.lineTo(r*2.1,r*.12);ctx.fill()}ctx.restore();
  // tranche crantée
  ctx.beginPath();for(let i=0;i<28;i++){const a=i/28*Math.PI*2,rr_=r*(i%2?1.0:1.07);ctx.lineTo(Math.cos(a)*rr_,Math.sin(a)*rr_)}ctx.closePath();
  const g=ctx.createLinearGradient(-r,-r,r,r);g.addColorStop(0,'#ffe27a');g.addColorStop(.5,'#e6a91e');g.addColorStop(1,'#a9660d');fs(g,true,5);
  ctx.beginPath();ctx.arc(0,0,r*.82,0,7);fs('#c98a14',true,4);
  ctx.beginPath();ctx.arc(0,0,r*.7,0,7);fs('#f3c443',true,3);
  // os croisés
  ctx.strokeStyle=INK;ctx.lineWidth=r*.15;ctx.lineCap='round';for(const s_ of[-1,1]){ctx.beginPath();ctx.moveTo(-r*.5,-r*.42*s_);ctx.lineTo(r*.5,r*.42*s_);ctx.stroke()}
  ctx.strokeStyle='#fff3cf';ctx.lineWidth=r*.09;for(const s_ of[-1,1]){ctx.beginPath();ctx.moveTo(-r*.5,-r*.42*s_);ctx.lineTo(r*.5,r*.42*s_);ctx.stroke()}
  // crâne
  ctx.beginPath();ctx.ellipse(0,-r*.08,r*.36,r*.34,0,0,7);fs('#fff3cf',true,4);
  ctx.beginPath();ctx.roundRect(-r*.18,r*.16,r*.36,r*.22,r*.06);fs('#fff3cf',true,4);
  ctx.fillStyle=INK;ctx.beginPath();ctx.ellipse(-r*.14,-r*.08,r*.09,r*.11,0,0,7);ctx.ellipse(r*.14,-r*.08,r*.09,r*.11,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(0,r*.04);ctx.lineTo(-r*.04,r*.12);ctx.lineTo(r*.04,r*.12);ctx.fill();
  ctx.strokeStyle=INK;ctx.lineWidth=3;for(const k of[-.09,0,.09]){ctx.beginPath();ctx.moveTo(r*k,r*.2);ctx.lineTo(r*k,r*.36);ctx.stroke()}
  // gemme rouge
  ctx.beginPath();ctx.moveTo(0,-r*.74);ctx.lineTo(r*.09,-r*.64);ctx.lineTo(0,-r*.54);ctx.lineTo(-r*.09,-r*.64);ctx.closePath();fs('#e2243a',true,3);
  ctx.restore();
  // étincelles
  seed=7;for(let i=0;i<14;i++){const a=rnd()*7+t*.5,d=r*(1.1+rnd()*1.1),k=.5+.5*Math.sin(t*4+i*2);ctx.fillStyle=`rgba(255,240,170,${k})`;const px=x+Math.cos(a)*d,py=y+Math.sin(a)*d;ctx.beginPath();ctx.moveTo(px,py-6*k);ctx.lineTo(px+2,py);ctx.lineTo(px,py+6*k);ctx.lineTo(px-2,py);ctx.fill()}}
function tag(txt,y,c1='#ffd24a'){ctx.save();ctx.font='700 26px P';ctx.textAlign='center';const w=ctx.measureText(txt).width+44;rr(W/2-w/2,y,w,44,8);fs('#2a0f06',true,4);ctx.strokeStyle=c1;ctx.lineWidth=3;ctx.stroke();ctx.fillStyle=c1;ctx.fillText(txt,W/2,y+32);ctx.restore()}
function pillB(x,y,w,lab,l,c){ctx.save();rr(x,y,w,52,26);fs(c,true,4);ctx.font='700 22px P';ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText(l+' : '+lab,x+22,y+27);ctx.restore()}
function cap(txt,y=508){ctx.save();ctx.font='700 34px P';const ws=parse(txt),sp=ctx.measureText(' ').width,wd=w=>ctx.measureText(w).width;let lines=[[]],cw=0;for(const it of ws){const w=wd(it[0]);if(cw+w>320&&lines[lines.length-1].length){lines.push([]);cw=0}lines[lines.length-1].push(it);cw+=w+sp}
  y-=(lines.length-1)*20;lines.forEach((ln,li)=>{const tot=ln.reduce((s,[w])=>s+wd(w),0)+sp*(ln.length-1);let x=W/2-tot/2;for(const [w,r] of ln){ctx.lineWidth=9;ctx.strokeStyle='#000';ctx.lineJoin='round';ctx.textAlign='left';ctx.strokeText(w,x,y+li*42);ctx.fillStyle=r?'#ffcf3a':'#fff';ctx.fillText(w,x,y+li*42);x+=wd(w)+sp}});ctx.restore()}
function hand(x,y,s,fist){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.ellipse(0,0,64,56,0,0,7);fs('#f2b98a',true,4);
  if(fist){for(let i=-2;i<=1;i++){ctx.beginPath();ctx.roundRect(i*40-8,-62,36,42,16);fs('#f2b98a',true,4)}}
  else{for(let i=-2;i<=2;i++){ctx.beginPath();ctx.roundRect(i*25-11,-118+Math.abs(i)*9,22,70,11);fs('#f2b98a',true,4)}ctx.beginPath();ctx.roundRect(54,-20,52,22,11);ctx.save();ctx.rotate(-.5);fs('#f2b98a',true,4);ctx.restore()}
  ctx.restore()}
function mini(x,y,s,o={}){ctx.save();ctx.translate(x,y);ctx.scale(s*(o.flip||1),s);
  const sk=o.skin||'#f2b98a',bd=o.body||'#6a6f7d',hr=o.hair||'#c8583a',ar=o.arm??0;
  // jambes
  ctx.lineCap='round';ctx.strokeStyle=INK;ctx.lineWidth=14;for(const sx of[-1,1]){ctx.beginPath();ctx.moveTo(sx*8,30);ctx.lineTo(sx*(8+(o.spread||0)),62+(o.step?Math.sin(T*10+sx)*5:0));ctx.stroke()}
  ctx.strokeStyle='#3a3f55';ctx.lineWidth=9;for(const sx of[-1,1]){ctx.beginPath();ctx.moveTo(sx*8,30);ctx.lineTo(sx*(8+(o.spread||0)),62+(o.step?Math.sin(T*10+sx)*5:0));ctx.stroke()}
  // bras
  ctx.strokeStyle=INK;ctx.lineWidth=13;for(const sx of[-1,1]){const a=sx*(.5+ar)-Math.PI/2*0;ctx.beginPath();ctx.moveTo(sx*17,8);ctx.lineTo(sx*(17+Math.sin(sx*(.4+ar))*26),8+(1-ar*1.2)*26-ar*30);ctx.stroke()}
  ctx.strokeStyle=bd;ctx.lineWidth=8;for(const sx of[-1,1]){ctx.beginPath();ctx.moveTo(sx*17,8);ctx.lineTo(sx*(17+Math.sin(sx*(.4+ar))*26),8+(1-ar*1.2)*26-ar*30);ctx.stroke()}
  rr(-18,0,36,38,10);fs(bd,true,3);
  ctx.beginPath();ctx.arc(0,-14,19,0,7);fs(sk,true,3);
  ctx.beginPath();ctx.arc(0,-19,19.5,Math.PI,0);ctx.closePath();fs(hr,true,3);
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(-7,-13,2.6,0,7);ctx.arc(7,-13,2.6,0,7);ctx.fill();
  if(o.open){ctx.beginPath();ctx.ellipse(0,-4,4,5,0,0,7);fs('#5a1218',true,2)}else{ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-4,-4);ctx.lineTo(4,-4);ctx.stroke()}
  ctx.restore()}
